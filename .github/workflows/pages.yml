name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run repository gates and build
        run: npm run ci
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test published build entry
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            body="$(curl --fail --silent --show-error --location "$PAGE_URL")"
            if printf '%s' "$body" | grep -Fq './assets/' && ! printf '%s' "$body" | grep -Fq '/src/'; then
              asset="$(printf '%s' "$body" | sed -n 's/.*src="\(\.\/assets\/[^" ]*\.js\)".*/\1/p' | head -n 1)"
              test -n "$asset"
              curl --fail --silent --show-error --location --output /dev/null "${PAGE_URL%/}/$asset"
              echo "PAGES_PUBLISHED_BUILD_PASS asset=$asset"
              exit 0
            fi
            sleep 5
          done
          echo "PAGES_PUBLISHED_BUILD_FAIL: published entry was not the built relative artifact" >&2
          exit 1
